name: Build KOReader for Kindle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout KOReader Source Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion git wget unzip patch build-essential \
            autoconf automake cmake libtool libtool-bin nasm luarocks gperf \
            gettext libssl-dev libffi-dev pkg-config libglib2.0-dev

      - name: Cache Toolchain and Thirdparty
        uses: actions/cache@v4
        with:
          path: |
            ~/.koxtoolchain
            ./base/thirdparty
          key: ${{ runner.os }}-koreader-kindle-${{ hashFiles('**/Makefile*', '**/vptc.sh') }}
          restore-keys: |
            ${{ runner.os }}-koreader-kindle-

      - name: Fetch Thirdparty Dependencies
        run: |
          make fetchthirdparty

      - name: Compile KOReader for Kindle
        run: |
          make TARGET=kindlepw2 release
          
      - name: Find and Package Artifact
        run: |
          mkdir ./output
          cp dist/koreader-kindlehf-*.zip ./output/ || cp dist/koreader-kindle-*.zip ./output/ || true

      - name: Upload Kindle Installation File
        uses: actions/upload-artifact@v4
        with:
          name: koreader-kindle-build
          path: ./output/*
          if-no-files-found: error
